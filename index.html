</script>
<style>
:root{
  --bg:#ffffff;
  --surface:#f7f7f8;
  --surface-2:#eef0f2;
  --ink:#16181d;
  --ink-soft:#5b5f6a;
  --ink-faint:#8a8e98;
  --line:#e3e4e8;
  --line-strong:#cfd1d7;
  --brand:#9d1b2c;
  --brand-dark:#711321;
  --brand-tint:#fbecee;
  --good:#1f7a4d;
  --good-tint:#e9f6ef;
  --warn:#a56a12;
  --warn-tint:#fdf3e2;
  --bad:#b23434;
  --bad-tint:#fceeed;
  --blue:#2f5fa3;
  --blue-tint:#eaf1fa;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,20,24,.04), 0 1px 0 rgba(20,20,24,.03);
  font-variant-numeric: tabular-nums;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;}
button{font-family:inherit;}
a{color:inherit;}

/* ===== App shell ===== */
#app{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:220px;flex:0 0 220px;
  background:var(--ink);
  color:#fff;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand-row{
  display:flex;align-items:center;gap:10px;
  padding:20px 18px 14px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand-mark{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex:none;overflow:hidden;
}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-text{line-height:1.2;}
.brand-text .t1{font-size:13px;font-weight:700;}
.brand-text .t2{font-size:11px;color:rgba(255,255,255,.55);}

nav#navlinks{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;
  color:rgba(255,255,255,.72);
  font-size:13px;font-weight:500;
  cursor:pointer;user-select:none;
  border:1px solid transparent;
  white-space:nowrap;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(157,27,44,.9);color:#fff;}
.nav-icon{width:16px;height:16px;flex:none;opacity:.85;}
.nav-item.active .nav-icon{opacity:1;}

.sidebar-foot{
  padding:14px 16px 16px 16px;
  border-top:1px solid rgba(255,255,255,.08);
  font-size:11.5px;color:rgba(255,255,255,.5);
}
.sidebar-foot b{color:rgba(255,255,255,.85);}

/* Main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  position:sticky;top:0;z-index:20;
  background:#fff;border-bottom:1px solid var(--line);
  padding:14px 24px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
#topbar .page-title{font-size:18px;margin-right:auto;}
#topbar .page-sub{display:block;font-size:12px;font-weight:400;color:var(--ink-soft);margin-top:2px;}

.report-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-soft);
}
.report-pill b{color:var(--ink);font-weight:600;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;}
#asOfSelect{border:none;background:transparent;font-weight:700;color:var(--ink);font-size:12.5px;cursor:pointer;font-family:inherit;}
#asOfSelect:focus{outline:none;}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);
  background:#fff;color:var(--ink);font-size:12.8px;font-weight:600;
  cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--surface);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.primary:hover{background:var(--brand-dark);}
.btn svg{width:14px;height:14px;}
#content{padding:22px 24px 60px 24px;max-width:1500px;width:100%;margin:0 auto;}

/* Filter bar */
.filterbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-bottom:18px;
}
.filterbar .fspacer{flex:1;}
.filter-chip-group{position:relative;}
.filter-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:8px;border:1px solid var(--line-strong);
  background:#fff;font-size:12.5px;color:var(--ink-soft);cursor:pointer;
}
.filter-btn.has-value{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-tint);}
.filter-btn .count{
  background:var(--brand);color:#fff;border-radius:999px;
  font-size:10.5px;padding:1px 6px;font-weight:700;
}
.filter-panel{
  display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;
  background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,20,30,.12);
  padding:8px;min-width:220px;max-height:280px;overflow-y:auto;
}
.filter-panel.open{display:block;}
.filter-opt{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12.6px;cursor:pointer;
}
.filter-opt:hover{background:var(--surface);}
.filter-opt input{margin:0;}
.filter-clear{font-size:11.5px;color:var(--brand);cursor:pointer;padding:6px 8px;border-top:1px solid var(--line);margin-top:4px;font-weight:600;}
.clear-all{font-size:12px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px;}
.kpi-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);
}
.kpi-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
.kpi-value{font-size:22px;font-weight:700;letter-spacing:-.01em;}
.kpi-value .unit{font-size:12px;font-weight:600;color:var(--ink-soft);margin-left:2px;}
.kpi-sub{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.kpi-card.accent-bad .kpi-value{color:var(--bad);}
.kpi-card.accent-good .kpi-value{color:var(--good);}
.kpi-card.accent-warn .kpi-value{color:var(--warn);}
.kpi-card.accent-brand .kpi-value{color:var(--brand);}

/* Panels */
.panel{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 16px 18px;margin-bottom:18px;box-shadow:var(--shadow);
}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.panel-title{font-size:14px;font-weight:700;}
.panel-note{font-size:11.5px;color:var(--ink-faint);}
.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:980px){.grid-2,.grid-2b{grid-template-columns:1fr;}}

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.6px;}
thead th{
  text-align:left;font-size:11px;font-weight:700;color:var(--ink-soft);
  text-transform:none;padding:8px 10px;border-bottom:1px solid var(--line-strong);
  white-space:nowrap;position:sticky;top:0;background:#fff;cursor:pointer;
}
thead th:hover{color:var(--ink);}
thead th .arrow{opacity:.4;margin-left:3px;font-size:10px;}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink);}
tbody tr:hover{background:var(--surface);}
tbody tr:last-child td{border-bottom:none;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.mono-name{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;white-space:nowrap;
}
.badge.ready{background:var(--good-tint);color:var(--good);}
.badge.partial{background:var(--warn-tint);color:var(--warn);}
.badge.notready{background:var(--bad-tint);color:var(--bad);}
.badge.fso{background:var(--brand-tint);color:var(--brand-dark);}
.badge.so{background:var(--blue-tint);color:var(--blue);}
.badge.age30{background:var(--bad-tint);color:var(--bad);}

.tablefoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.8px;color:var(--ink-faint);}
input.tsearch{
  border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;font-size:12.5px;width:180px;
}

.chart-box{position:relative;height:280px;}
.chart-box.tall{height:340px;}

.empty-state{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
}
.empty-state h3{font-size:16px;margin-bottom:6px;color:var(--ink);}
.empty-state p{font-size:13px;max-width:420px;margin:0 auto 16px auto;}

.tabs-row{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tab-btn{
  padding:9px 4px;margin-right:18px;font-size:13px;font-weight:600;color:var(--ink-soft);
  border-bottom:2px solid transparent;cursor:pointer;
}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--brand);}

.info-banner{
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;
  padding:10px 14px;font-size:12px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5;
}
.info-banner b{color:var(--ink);}

#dataBanner:empty{display:none;}
.data-error-banner{
  margin:0 24px;margin-top:14px;
  background:var(--warn-tint);border:1px solid var(--warn);border-radius:10px;
  padding:14px 16px;font-size:12.8px;color:var(--ink);line-height:1.6;
}
.data-error-banner .deb-title{font-weight:700;color:var(--warn);margin-bottom:4px;font-size:13px;}
.data-error-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px;}
.data-error-banner ol{margin:6px 0 0 18px;padding:0;}
.data-error-banner li{margin-bottom:3px;}
.data-error-banner .deb-actions{margin-top:10px;display:flex;gap:8px;align-items:center;}

.legend-row{display:flex;gap:14px;align-items:center;font-size:11.8px;color:var(--ink-soft);margin-bottom:8px;flex-wrap:wrap;}
.legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:12.8px;
  z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;
}
.toast.show{display:block;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#d6d7dc;border-radius:6px;}
</style>
</head>

function fmtMT(kg){
  if(kg===null || kg===undefined || isNaN(kg)) return '—';
  return (kg/MT).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' MT';
}

  if(kg===null || kg===undefined || isNaN(kg)) return '—';
  return (kg/MT).toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1});
}

function prettyDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

  if(!iso) return '—';

  if(age<=15) return '8–15 days';
  if(age<=30) return '16–30 days';

function buildNav(){
  const nav = document.getElementById('navlinks');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(item=>{
    const el = document.createElement('div');
    el.className = 'nav-item' + (item.id===CURRENT_PAGE?' active':'');
    el.innerHTML = `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[item.id]}</svg><span>${item.label}</span>`;
    el.addEventListener('click', ()=>{ CURRENT_PAGE = item.id; buildNav(); renderTopMeta(); renderPage(); window.scrollTo(0,0); });
    nav.appendChild(el);
  });
}

function renderTopMeta(){
  const meta = PAGE_META[CURRENT_PAGE];
  document.getElementById('pageTitle').textContent = meta.title;
  const dLabel = prettyDate(asOfDate());
  document.getElementById('pageSub').textContent = meta.sub.replace('{d}', dLabel);
  const ld = latestDate();
  document.getElementById('sfLatest').textContent = ld? prettyDate(ld) : '—';
  document.getElementById('sfSnapCount').textContent = allDates().length;

  const wrap = document.getElementById('asOfWrap');
  const sel = document.getElementById('asOfSelect');
  if(ASOF_PAGES.has(CURRENT_PAGE) && ld){
    wrap.style.display = '';
    const dates = allDates().slice().reverse();
    sel.innerHTML = dates.map(d=>`<option value="${d}" ${d===asOfDate()?'selected':''}>${prettyDate(d)}${d===ld?' (latest)':''}</option>`).join('');
    sel.onchange = ()=>{ AS_OF = sel.value; renderTopMeta(); renderPage(); };
  } else {
    wrap.style.display = ld? 'none' : 'none';
  }
}

/* ============================================================
   FILTER BAR COMPONENT
   ============================================================ */
function getDistinctValues(rows, field){
  return Array.from(new Set(rows.map(r=>r[field]).filter(v=>v!==null && v!==undefined && v!==''))).sort((a,b)=>String(a).localeCompare(String(b)));
}
function closeAllFilterPanels(){ document.querySelectorAll('.filter-panel.open').forEach(p=>p.classList.remove('open')); }
document.addEventListener('click', closeAllFilterPanels);

function renderFilterBar(container, fieldsConfig, optionRows){
  container.innerHTML = '';
  container.className = 'filterbar';
  fieldsConfig.forEach(([field,label])=>{
    const wrap = document.createElement('div'); wrap.className='filter-chip-group';
    const btn = document.createElement('button'); btn.className='filter-btn';
    const n = FILTERS[field].size;
    if(n>0) btn.classList.add('has-value');
    btn.innerHTML = `<span>${label}</span>${n? `<span class="count">${n}</span>`:''}<span style="opacity:.5">▾</span>`;
    const panel = document.createElement('div'); panel.className='filter-panel';
    const opts = getDistinctValues(optionRows, field);
    if(opts.length===0){
      panel.innerHTML = '<div style="padding:8px;font-size:12px;color:var(--ink-faint);">No values</div>';
    }
    opts.forEach(v=>{
      const row = document.createElement('label'); row.className='filter-opt';
      const checked = FILTERS[field].has(v) ? 'checked' : '';
      row.innerHTML = `<input type="checkbox" ${checked}><span>${escapeHtml(v)}</span>`;
      row.querySelector('input').addEventListener('change', e=>{
        if(e.target.checked) FILTERS[field].add(v); else FILTERS[field].delete(v);
        renderPage();
      });
      panel.appendChild(row);
    });
    if(opts.length){
      const clear = document.createElement('div'); clear.className='filter-clear'; clear.textContent='Clear';
      clear.addEventListener('click', ()=>{ FILTERS[field].clear(); renderPage(); });
      panel.appendChild(clear);
    }
    panel.addEventListener('click', e=>e.stopPropagation());
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const wasOpen = panel.classList.contains('open');
      closeAllFilterPanels();
      if(!wasOpen) panel.classList.add('open');
    });
    wrap.appendChild(btn); wrap.appendChild(panel);
    container.appendChild(wrap);
  });
  const spacer = document.createElement('div'); spacer.className='fspacer'; container.appendChild(spacer);
  if(anyFilterActive()){
    const clearAll = document.createElement('div'); clearAll.className='clear-all'; clearAll.textContent='Clear all filters';
    clearAll.addEventListener('click', clearAllFilters);
    container.appendChild(clearAll);
  }
}

/* ============================================================
   TABLE COMPONENT (self-managing sort/search)
   ============================================================ */
function renderTable({container, tableId, columns, rows, maxRows, searchEl, emptyMsg}){
  if(!SORT_STATE[tableId]) SORT_STATE[tableId] = {col:columns[0].key, dir: columns[0].defaultDesc? -1:1};
  if(SEARCH_STATE[tableId]===undefined) SEARCH_STATE[tableId]='';

  function doRender(){
    const state = SORT_STATE[tableId];
    const search = SEARCH_STATE[tableId];
    let data = rows;
    if(search){
      const s = search.toLowerCase();
      data = data.filter(r=> columns.some(c=> String(r[c.key]??'').toLowerCase().includes(s)) );
    }
    const sorted = [...data].sort((a,b)=>{
      const va=a[state.col], vb=b[state.col];
      let cmp;
      if(typeof va==='number' && typeof vb==='number') cmp = va-vb;
      else cmp = String(va??'').localeCompare(String(vb??''), undefined, {numeric:true});
      return cmp*state.dir;
    });
    const shown = maxRows? sorted.slice(0,maxRows) : sorted;
    let html = `<div class="table-wrap"><table><thead><tr>`;
    columns.forEach(c=>{
      const arrow = state.col===c.key ? (state.dir===1?'▲':'▼') : '';
      html += `<th data-col="${c.key}" class="${c.align==='num'?'num':''}">${c.label}<span class="arrow">${arrow}</span></th>`;
    });
    html += `</tr></thead><tbody>`;
    if(shown.length===0){
      html += `<tr><td colspan="${columns.length}" style="text-align:center;color:var(--ink-faint);padding:26px;">${emptyMsg||'No matching rows'}</td></tr>`;
    }
    shown.forEach(r=>{
      html += '<tr' + (r.__rowClick? ' data-rk="'+escapeHtml(r.__rowKey)+'" style="cursor:pointer"' : '') + '>' + columns.map(c=>{
        const val = c.fmt ? c.fmt(r) : escapeHtml(r[c.key]);
        return `<td class="${c.align==='num'?'num':''}">${val}</td>`;
      }).join('') + '</tr>';
    });
    html += `</tbody></table></div>`;
    html += `<div class="tablefoot"><span>Showing ${shown.length.toLocaleString('en-IN')} of ${data.length.toLocaleString('en-IN')}${data.length!==rows.length? ' (filtered from '+rows.length+')':''} row(s)</span></div>`;
    container.innerHTML = html;
    container.querySelectorAll('th').forEach(th=>{
      th.addEventListener('click', ()=>{
        const col = th.dataset.col;
        if(state.col===col) state.dir*=-1; else { state.col=col; state.dir=1; }
        doRender();
      });
    });
    if(rows.length && rows[0].__rowClick){
      container.querySelectorAll('tbody tr[data-rk]').forEach(tr=>{
        tr.addEventListener('click', ()=> rows[0].__rowClick(tr.dataset.rk));
      });
    }
  }
  if(searchEl){
    searchEl.innerHTML = `<input class="tsearch" placeholder="Search…" value="${escapeHtml(SEARCH_STATE[tableId])}">`;
    searchEl.querySelector('input').addEventListener('input', e=>{ SEARCH_STATE[tableId]=e.target.value; doRender(); });
  }
  doRender();
}

/* ============================================================
   FSO → SO CONVERSION (historical, dedup logic)
   ============================================================ */
function computeDedupedConversion(useFilters, respectDateRange){
  let flat = allRowsFlat();
  if(useFilters) flat = applyFilters(flat);
  if(respectDateRange){
    if(CONV_FROM) flat = flat.filter(r=>r.ReportDate>=CONV_FROM);
    if(CONV_TO) flat = flat.filter(r=>r.ReportDate<=CONV_TO);
  }
  const candidates = flat.filter(r=>r.OrderType==='SO' && r.ForcastOrderNo);
  const firstSeen = {}, rep = {};
  // Key by VNo + Product (not VNo alone): one SO voucher can carry several
  // product lines, each with its own RaisedQty — keying on VNo alone would
  // keep only one line and silently drop the rest of that voucher's quantity.
  candidates.forEach(r=>{
    const key = rowKey(r);
    if(!firstSeen[key] || r.ReportDate<firstSeen[key]) firstSeen[key]=r.ReportDate;
    if(!rep[key] || r.ReportDate>rep[key].ReportDate) rep[key]=r;
  });
  // The conversion date is the SO's own Date column (the day that SO was actually
  // raised) — a real, accurate transaction date — not just the day we happened to
  // first capture it in an uploaded snapshot. Falls back to first-seen only if the
  // row has no Date value at all.
  const records = Object.keys(rep).map(key=>{
    const r = rep[key];
    const convertedOn = r.Date || firstSeen[key];
    return {...r, FirstSeen: firstSeen[key], ConvertedOn: convertedOn};
  });
  const totalQty = sum(records,'RaisedQty');
  const byExecutive = {};
  records.forEach(r=>{ byExecutive[r.Executive]=(byExecutive[r.Executive]||0)+(r.RaisedQty||0); });
  return {records, totalQty, byExecutive};
}

function execConversionSummary(){
  const conv = computeDedupedConversion(true, true);
  const refDate = CONV_TO || latestDate();
  const refRows = applyFilters(SNAPSHOTS[refDate]||[]);
  const fsoPendingByExec = {};
  refRows.filter(r=>r.OrderType==='FSO').forEach(r=>{ fsoPendingByExec[r.Executive]=(fsoPendingByExec[r.Executive]||0)+(r.FinalPendingQty||0); });
  const execs = new Set([...Object.keys(conv.byExecutive), ...Object.keys(fsoPendingByExec)]);
  const rows = Array.from(execs).map(exec=>{
    const ConvertedQty = conv.byExecutive[exec]||0;
    const FsoPendingQty = fsoPendingByExec[exec]||0;
    const denom = ConvertedQty+FsoPendingQty;
    return {Executive:exec, ConvertedQty, FsoPendingQty, ConversionPct: denom>0? (ConvertedQty/denom*100) : null};
  }).sort((a,b)=>(b.ConversionPct??-1)-(a.ConversionPct??-1));
  const totalConverted = sum(rows,'ConvertedQty');
  const totalPending = sum(rows,'FsoPendingQty');
  const overallPct = (totalConverted+totalPending)>0 ? totalConverted/(totalConverted+totalPending)*100 : null;
  return {rows, overallPct, refDate};
}

function conversionPctTrend(execFilter){
  const dates = allDates();
  let flat = allRowsFlat();
  const candidates = flat.filter(r=>r.OrderType==='SO' && r.ForcastOrderNo && (!execFilter || execFilter==='__all__' || r.Executive===execFilter));
  const firstSeen={}, rep={};
  // Same VNo+Product keying as computeDedupedConversion — see the comment there.
  candidates.forEach(r=>{
    const key = rowKey(r);
    if(!firstSeen[key] || r.ReportDate<firstSeen[key]) firstSeen[key]=r.ReportDate;
    if(!rep[key] || r.ReportDate>rep[key].ReportDate) rep[key]=r;
  });
  // Bucket each converted line by its own Date column (the real conversion date),
  // falling back to first-seen only when Date is blank.
  const convertedOn = {};
  Object.keys(rep).forEach(key=>{ convertedOn[key] = rep[key].Date || firstSeen[key]; });
  return dates.map(d=>{
    const upTo = Object.keys(rep).filter(key=>convertedOn[key]<=d).map(key=>rep[key]);
    const convertedQty = sum(upTo,'RaisedQty');
    const dayRows = (SNAPSHOTS[d]||[]).filter(r=>r.OrderType==='FSO' && (!execFilter || execFilter==='__all__' || r.Executive===execFilter));
    const fsoPending = sum(dayRows,'FinalPendingQty');
    const denom = convertedQty+fsoPending;
    return {date:d, convertedQty, fsoPending, pct: denom>0? convertedQty/denom*100 : null};
  });
}

    ];
    renderTable({container:document.getElementById('pcTable'), tableId:'custTable', columns:cols, rows:custRows, searchEl:document.getElementById('pcSearch')});

    const detailWrap = document.getElementById('pcDetailWrap');
    if(SELECTED_CUSTOMER){
      const detailRows = rows.filter(r=>r.CustomerName===SELECTED_CUSTOMER);
      detailWrap.innerHTML = `<div class="panel">
        <div class="panel-head"><div class="panel-title">Order lines — ${escapeHtml(SELECTED_CUSTOMER)}</div><div class="panel-note" style="cursor:pointer;color:var(--brand);font-weight:600;" id="closeDetail">Close ✕</div></div>
        <div id="pcDetailTable"></div>
      </div>`;
      document.getElementById('closeDetail').addEventListener('click', ()=>{ SELECTED_CUSTOMER=null; renderProducts(); });
      const dcols = [
        {key:'Product', label:'Product', fmt:r=>`<span class="mono-name" title="${escapeHtml(r.Product)}">${escapeHtml(r.Product)}</span>`},
        {key:'VNo', label:'VNo'},
        {key:'Executive', label:'Executive'},
        {key:'RaisedQty', label:'Raised', align:'num', fmt:r=>fmtKg(r.RaisedQty)},
        {key:'FinalPendingQty', label:'Pending', align:'num', fmt:r=>fmtKg(r.FinalPendingQty)},
        {key:'ReadyFlag', label:'Status', fmt:r=>{const cls=r.ReadyFlag==='Ready'?'ready':r.ReadyFlag==='Partial Stock'?'partial':'notready'; return `<span class="badge ${cls}">${r.ReadyFlag}</span>`;}},
        {key:'ScheduleDate', label:'Schedule', fmt:r=>shortDate(r.ScheduleDate)},
        {key:'EDD1', label:'EDD', fmt:r=>shortDate(r.EDD1)},
      ];
      renderTable({container:document.getElementById('pcDetailTable'), tableId:'custDetail', columns:dcols, rows:detailRows});
    } else {
      detailWrap.innerHTML = '';
    }
  }
}

/* ============================================================
   PAGE: COMPARE SNAPSHOTS
   ============================================================ */
let CMP_A = null, CMP_B = null;
function rowKey(r){ return r.VNo+'|'+r.Product; }

function renderCompare(){
  const content = document.getElementById('content');
  const dates = allDates();
  if(!CMP_B || !dates.includes(CMP_B)) CMP_B = dates[dates.length-1];
  if(!CMP_A || !dates.includes(CMP_A)) CMP_A = dates.length>1 ? dates[dates.length-2] : dates[0];

  content.innerHTML = `
    <div class="filterbar">
      <div class="filter-btn" style="cursor:default;">Compare</div>
      <select id="cmpA" style="border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;"></select>
      <span style="color:var(--ink-faint);font-size:12px;">→</span>
      <select id="cmpB" style="border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;"></select>
      <span style="color:var(--ink-faint);font-size:11.5px;">Order lines matched by VNo + Product</span>
    </div>
    <div id="cmpBody"></div>
  `;
  const selA = document.getElementById('cmpA'), selB = document.getElementById('cmpB');
  selA.innerHTML = dates.map(d=>`<option value="${d}" ${d===CMP_A?'selected':''}>${prettyDate(d)}</option>`).join('');
  selB.innerHTML = dates.map(d=>`<option value="${d}" ${d===CMP_B?'selected':''}>${prettyDate(d)}${d===dates[dates.length-1]?' (latest)':''}</option>`).join('');
  selA.addEventListener('change', ()=>{ CMP_A=selA.value; renderCompare(); });
  selB.addEventListener('change', ()=>{ CMP_B=selB.value; renderCompare(); });

  const body = document.getElementById('cmpBody');
  if(dates.length<2){
    body.innerHTML = `<div class="empty-state"><h3>Only one snapshot saved</h3><p>Upload another day's export to start seeing what changed between snapshots.</p></div>`;
    return;
  }
  if(CMP_A===CMP_B){
    body.innerHTML = `<div class="empty-state"><h3>Pick two different dates</h3><p>Choose a different "from" and "to" snapshot to see what changed.</p></div>`;
    return;
  }

  const rowsA = applyFilters(SNAPSHOTS[CMP_A]||[]);
  const rowsB = applyFilters(SNAPSHOTS[CMP_B]||[]);
  const mapA = new Map(rowsA.map(r=>[rowKey(r), r]));
  const mapB = new Map(rowsB.map(r=>[rowKey(r), r]));

  const newOrders = [], closedOrders = [], changedOrders = [];
  mapB.forEach((r,k)=>{ if(!mapA.has(k)) newOrders.push(r); });
  mapA.forEach((r,k)=>{ if(!mapB.has(k)) closedOrders.push(r); });
  mapB.forEach((rB,k)=>{
    if(mapA.has(k)){
      const rA = mapA.get(k);
      const delta = (rB.FinalPendingQty||0) - (rA.FinalPendingQty||0);
      if(Math.abs(delta) > 0.001){
        changedOrders.push({...rB, OldPending:rA.FinalPendingQty, NewPending:rB.FinalPendingQty, Delta:delta});
      }
    }
  });

  const netChange = sum(rowsB,'FinalPendingQty') - sum(rowsA,'FinalPendingQty');

  body.innerHTML = `
    <div id="filterBar"></div>
    <div class="kpi-grid" id="cmpKpis"></div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">New order lines</div><div class="panel-note">Present on ${prettyDate(CMP_B)} but not ${prettyDate(CMP_A)}</div></div>
      <div id="cmpNewTable"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Closed / removed order lines</div><div class="panel-note">Present on ${prettyDate(CMP_A)} but not ${prettyDate(CMP_B)} — likely dispatched, cancelled, or fully invoiced</div></div>
      <div id="cmpClosedTable"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Changed pending quantity</div><div class="panel-note">Same order line, quantity moved</div></div>
      <div id="cmpChangedTable"></div>
    </div>
  `;
  renderFilterBar(document.getElementById('filterBar'),
    [['Executive','Executive'],['Product','Product'],['CustomerName','Customer'],['OrderType','Order type']],
    [...rowsA, ...rowsB]);

  const kpis = [
    {label:'New order lines', value: newOrders.length.toLocaleString('en-IN'), sub: fmtMT(sum(newOrders,'FinalPendingQty'))+' pending'},
    {label:'Closed / removed lines', value: closedOrders.length.toLocaleString('en-IN'), sub: fmtMT(sum(closedOrders,'FinalPendingQty'))+' was pending', accent:'good'},
    {label:'Lines with qty change', value: changedOrders.length.toLocaleString('en-IN')},
    {label:'Net pending qty change', value: (netChange>=0?'+':'')+fmtMT(netChange), accent: netChange>0?'bad':'good'},
  ];
  document.getElementById('cmpKpis').innerHTML = kpis.map(k=>`
    <div class="kpi-card${k.accent?' accent-'+k.accent:''}"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div>${k.sub?`<div class="kpi-sub">${k.sub}</div>`:''}</div>`).join('');

  const baseCols = [
    {key:'Product', label:'Product', fmt:r=>`<span class="mono-name" title="${escapeHtml(r.Product)}">${escapeHtml(r.Product)}</span>`},
    {key:'VNo', label:'VNo'},
    {key:'CustomerName', label:'Customer', fmt:r=>`<span class="mono-name" title="${escapeHtml(r.CustomerName)}">${escapeHtml(r.CustomerName)}</span>`},
    {key:'Executive', label:'Executive'},
    {key:'OrderType', label:'Type', fmt:r=>`<span class="badge ${r.OrderType==='FSO'?'fso':'so'}">${r.OrderType}</span>`},
    {key:'FinalPendingQty', label:'Pending', align:'num', fmt:r=>fmtKg(r.FinalPendingQty), defaultDesc:true},
  ];
  renderTable({container:document.getElementById('cmpNewTable'), tableId:'cmpNew', columns:baseCols, rows:newOrders, emptyMsg:'No new order lines in this range'});
  renderTable({container:document.getElementById('cmpClosedTable'), tableId:'cmpClosed', columns:baseCols, rows:closedOrders, emptyMsg:'No order lines closed out in this range'});

  const changedCols = [
    {key:'Product', label:'Product', fmt:r=>`<span class="mono-name" title="${escapeHtml(r.Product)}">${escapeHtml(r.Product)}</span>`},
    {key:'VNo', label:'VNo'},
    {key:'CustomerName', label:'Customer', fmt:r=>`<span class="mono-name" title="${escapeHtml(r.CustomerName)}">${escapeHtml(r.CustomerName)}</span>`},
    {key:'Executive', label:'Executive'},
    {key:'OldPending', label:prettyDate(CMP_A), align:'num', fmt:r=>fmtKg(r.OldPending)},
    {key:'NewPending', label:prettyDate(CMP_B), align:'num', fmt:r=>fmtKg(r.NewPending)},
    {key:'Delta', label:'Change', align:'num', defaultDesc:true, fmt:r=>`<span style="color:${r.Delta>0?'var(--bad)':'var(--good)'};font-weight:700;">${r.Delta>0?'+':''}${fmtKg(r.Delta)}</span>`},
  ];
  renderTable({container:document.getElementById('cmpChangedTable'), tableId:'cmpChanged', columns:changedCols, rows:changedOrders, emptyMsg:'No pending-quantity changes in this range'});
}

/* ============================================================
   PAGE ROUTER
   ============================================================ */
function renderPage(){
  closeAllFilterPanels();
  if(allDates().length===0){
    document.getElementById('content').innerHTML = `<div class="empty-state"><h3>No data loaded yet</h3><p>Upload a daily FSO/SO pending-order export to get started.</p></div>`;
    return;
  }
  switch(CURRENT_PAGE){
    case 'overview': renderOverview(); break;
    case 'dispatch': renderDispatch(); break;
    case 'executive': renderExecutive(); break;
    case 'conversion': renderConversion(); break;
    case 'ageing': renderAgeing(); break;
    case 'products': renderProducts(); break;
    case 'compare': renderCompare(); break;
  }
}

/* ============================================================
   DATA LOADING — master_data.json (built by your update_data.py
   script from the daily Excel exports in ./daily_excel_files/)
   ============================================================ */
function normKey(k){ return String(k).trim().toLowerCase().replace(/[^a-z0-9]/g,''); }

// Handles: JS Date objects, Excel serial numbers, and the "dd-mm-yy" strings
// that pandas writes out (via df.dt.strftime('%d-%m-%y')) for every date column.
function isoFromCell(v){
  if(v===null||v===undefined||v==='') return null;
  let d;
  if(v instanceof Date){
    d = v;
  } else {
    const s = String(v).trim();
    const ddmmyy = s.match(/^(\d{1,2})-(\d{1,2})-(\d{2})$/);
    if(ddmmyy){
      const dd = +ddmmyy[1], mm = +ddmmyy[2], yy = +ddmmyy[3];
      const yyyy = yy < 70 ? 2000+yy : 1900+yy;
      d = new Date(Date.UTC(yyyy, mm-1, dd));
    } else {
      const n = Number(v);
      if(!isNaN(n) && s!=='' && !/[a-zA-Z]/.test(s)){
        d = new Date(Math.round((n-25569)*86400*1000)); // Excel serial date
      } else {
        d = new Date(v);
      }
    }
  }
  if(isNaN(d.getTime())) return null;
  if(d.getFullYear()<=1900) return null;
  return d.toISOString().slice(0,10);
}
function toNum(v){
  if(v===null||v===undefined||v==='') return 0;
  const n = Number(v);
  return isNaN(n)? 0 : n;
}
function toText(v){
  if(v===null||v===undefined) return null;
  const s = String(v).trim();
  return (s===''||s.toLowerCase()==='nan') ? null : s;
}

// Voucher series to drop entirely from every snapshot (raised at the source data level)
const EXCLUDED_VOUCHER_SERIES = new Set(['SO-BR','SOEXP']);
function isExcludedRow(raw){
  const vs = (raw && raw.VoucherSeries ? String(raw.VoucherSeries) : '').trim().toUpperCase();
  return EXCLUDED_VOUCHER_SERIES.has(vs);
}

// Converts one raw row (original Excel-style headers, e.g. from master_data.json) into
// the dashboard's canonical field shape — the same mapping used everywhere else.
function normalizeRawRow(row){
  const norm = {};
  Object.keys(row).forEach(k=>{
    const canon = FIELD_MAP[normKey(k)];
    if(canon) norm[canon] = row[k];
  });
  const out = {};
  TEXT_FIELDS.forEach(f=> out[f] = toText(norm[f]));
  NUMERIC_FIELDS.forEach(f=> out[f] = norm[f]==null ? (f==='FinishedGodownStock'||f==='FSOConvertionAge'? null : 0) : toNum(norm[f]));
  DATE_FIELDS.forEach(f=> out[f] = isoFromCell(norm[f]));
  return out;
}

function guessReportDate(parsedRows){
  const dates = parsedRows.map(r=>r.Date).filter(Boolean).sort();
  return dates.length? dates[dates.length-1] : todayISO();
}

// Fetches ./master_data.json, tolerating the bare `NaN` tokens pandas'
// json.dump can leave behind for empty numeric cells (not valid JSON on its own).
async function fetchMasterData(){
  const res = await fetch('./master_data.json', {cache:'no-store'});
  if(!res.ok) throw new Error('master_data.json not found (HTTP '+res.status+')');
  let text = await res.text();
  text = text.replace(/:\s*NaN\b/g, ': null');
  return JSON.parse(text);
}

function buildSnapshotsFromRawRows(rawRows){
  const byDate = {};
  rawRows.forEach(raw=>{
    const normalized = normalizeRawRow(raw);
    if(!normalized.VNo || isExcludedRow(normalized)) return;
    const savedDateIso = isoFromCell(raw.Saved_Date) || guessReportDate([normalized]);
    if(!byDate[savedDateIso]) byDate[savedDateIso] = [];
    byDate[savedDateIso].push(processRaw(normalized, savedDateIso));
  });
  return byDate;
}

function loadBundledSeedFallback(){
  try{
    const seedRaw = JSON.parse(document.getElementById('seed-data').textContent);
    const seed = (seedRaw||[]).filter(r=>!isExcludedRow(r));
    if(seed && seed.length){
      const reportDate = guessReportDate(seed);
      SNAPSHOTS = { [reportDate]: seed.map(r=>processRaw(r, reportDate)) };
      return true;
    }
  }catch(e){}
  return false;
}

let USING_FALLBACK = false;

function renderDataBanner(){
  const el = document.getElementById('dataBanner');
  if(!el) return;
  if(!USING_FALLBACK){ el.innerHTML = ''; return; }
  const isFile = window.location.protocol === 'file:';
  const specific = isFile
    ? `<li>You're opening this file directly from disk (<code>file://…</code>) — browsers block a page from reading local JSON files this way, even from the same folder.</li>
       <li>Fix: serve the folder instead of double-clicking it — in VS Code, right-click <code>index.html</code> → "Open with Live Server", or open a terminal in the folder and run <code>python -m http.server 8000</code>, then visit <code>http://localhost:8000</code>.</li>`
    : `<li><code>master_data.json</code> wasn't found next to this page (or the server returned an error). Make sure the file exists in the same folder as this page.</li>`;
  el.innerHTML = `
    <div class="data-error-banner">
      <div class="deb-title">Showing bundled sample data — your real data isn't loading</div>
      <div>This is why the "Viewing" date and all the numbers below look outdated:</div>
      <ol>
        ${specific}
        <li>Make sure you've run <code>update_data.py</code> after adding today's Excel file to <code>daily_excel_files/</code> — it needs to run every time a new file is added.</li>
        <li>Once fixed, click Retry below (no need to reload the page).</li>
      </ol>
      <div class="deb-actions">
        <button class="btn primary" id="dataBannerRetry">Retry loading master_data.json</button>
      </div>
    </div>`;
  const btn = document.getElementById('dataBannerRetry');
  if(btn) btn.addEventListener('click', retryLoadMasterData);
}

async function retryLoadMasterData(){
  const btn = document.getElementById('dataBannerRetry');
  if(btn){ btn.disabled = true; btn.textContent = 'Retrying…'; }
  try{
    const rawRows = await fetchMasterData();
    if(Array.isArray(rawRows) && rawRows.length){
      const byDate = buildSnapshotsFromRawRows(rawRows);
      if(Object.keys(byDate).length > 0){
        SNAPSHOTS = byDate;
        USING_FALLBACK = false;
        AS_OF = null;
        renderDataBanner();
        renderTopMeta();
        renderPage();
        showToast('Loaded master_data.json successfully.');
        return;
      }
    }
    showToast('master_data.json loaded but had no usable rows.');
  }catch(e){
    showToast("Still couldn't load master_data.json — see the notice above for how to fix this.");
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Retry loading master_data.json'; }
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  let loadedFromMaster = false;
  try{
    const rawRows = await fetchMasterData();
    if(Array.isArray(rawRows) && rawRows.length){
      const byDate = buildSnapshotsFromRawRows(rawRows);
      SNAPSHOTS = byDate;
      loadedFromMaster = Object.keys(SNAPSHOTS).length > 0;
    }
  }catch(e){
    // master_data.json isn't reachable yet (e.g. update_data.py hasn't been run,
    // or this copy of index.html isn't being served over http/https) — fall through.
  }

  if(!loadedFromMaster){
    USING_FALLBACK = loadBundledSeedFallback();
  }

  buildNav();
  renderDataBanner();
  renderTopMeta();
  renderPage();
}
init();

</script>
